version: '3.8'

services:
  # Aplicación principal
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: chizhevsky-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ../data:/app/data:ro
      - ../research:/app/research:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chizhevsky-network

  # Servidor Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: chizhevsky-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../src/assets:/var/www/assets:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - chizhevsky-network

  # Base de datos para métricas (opcional)
  metrics-db:
    image: postgres:15-alpine
    container_name: chizhevsky-db
    environment:
      - POSTGRES_DB=heliobiology
      - POSTGRES_USER=chizhevsky
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/sql:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_password
    restart: unless-stopped
    networks:
      - chizhevsky-network

  # Monitorización (opcional)
  monitor:
    image: grafana/grafana:latest
    container_name: chizhevsky-monitor
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    secrets:
      - grafana_password
    depends_on:
      - metrics-db
    restart: unless-stopped
    networks:
      - chizhevsky-network

volumes:
  postgres_data:
  grafana_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt

networks:
  chizhevsky-network:
    driver: bridge
