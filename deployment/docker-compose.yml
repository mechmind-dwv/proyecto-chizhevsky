version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: chizhevsky_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./../dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # Si tenemos SSL
    restart: unless-stopped
    networks:
      - chizhevsky_net

  # Si en el futuro agregamos un backend, por ejemplo en Python:
  # api:
  #   build: ./../src/backend
  #   container_name: chizhevsky_api
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - FLASK_ENV=production
  #   networks:
  #     - chizhevsky_net

networks:
  chizhevsky_net:
    driver: bridge

volumes:
  data:
