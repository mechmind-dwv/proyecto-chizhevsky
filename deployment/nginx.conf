events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuración básica
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Configuración de compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Servidor HTTP
    server {
        listen 80;
        server_name _;

        # Raíz del proyecto
        root /usr/share/nginx/html;
        index index.html;

        # Configuración para SPA (Single Page Application) - si usas enrutamiento frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Configuración para archivos estáticos
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Configuración para archivos de datos
        location /data/ {
            expires 6h;
            add_header Cache-Control "public";
        }

        # Configuración de seguridad
        location ~ /\. {
            deny all;
        }

        # Configuración para API (si en el futuro tenemos backend)
        # location /api/ {
        #     proxy_pass http://api:5000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }

    # Si tenemos SSL, podemos agregar otro bloque server para HTTPS
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ... resto de configuración igual que el servidor HTTP ...
    # }
}
